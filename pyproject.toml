[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-fde-engine"
version = "0.1.0"
description = "AI驱动的FDE交付引擎 - 调研、设计、开发、迭代全流程AI化"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AI-FDE Team"}]
keywords = ["ai", "agent", "fde", "llm", "rag", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.7",
    "httpx>=0.27.0",
    "aiofiles>=23.2.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "redis>=5.0.0",
    "minio>=7.2.0",
    "qdrant-client>=1.9.0",
    "pydantic-ai>=0.8.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]
docling = ["docling>=2.0.0"]
marker = ["marker-pdf>=1.0.0"]
deepeval = ["deepeval>=0.24.0"]
all = ["docling>=2.0.0", "marker-pdf>=1.0.0", "deepeval>=0.24.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "slow: 慢速测试（可用 -m 'not slow' 跳过）",
    "performance: 性能测试（验证性能指标）",
    "security: 安全测试（脱敏/注入/越权）",
    "customer: 自助型客户场景测试（F7）",
    "fde: FDE工程师场景测试",
    "ops: 系统管理员/运维场景测试",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
