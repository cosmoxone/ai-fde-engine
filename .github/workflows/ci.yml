name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 核心依赖安装：验证 Mock 模式零外部依赖可运行（与 README 承诺一致）
      - name: Install core dependencies
        run: |
          pip install -r requirements-core.txt
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Smoke test (mock mode)
        env:
          MEMORY_STORAGE_DIR: /tmp/aifde-memory
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from src.main import app
          c = TestClient(app)
          r = c.get('/api/v1/health')
          assert r.status_code == 200 and r.json()['status'] == 'healthy', r.text
          r = c.post('/api/v1/projects', json={'name': 'ci-smoke'})
          assert r.status_code == 200 and r.json()['success'], r.text
          print('smoke test passed: health + create project OK (mock mode)')
          "

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f deploy/Dockerfile -t aifde-engine-ci .
