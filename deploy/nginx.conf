# ============================================
# AI-FDE Engine Nginx 配置
# ============================================

upstream aifde_backend {
    server ai-fde-app:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 客户端最大上传大小（支持大文档上传）
    client_max_body_size 500m;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API代理
    location /api/ {
        proxy_pass http://aifde_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 长任务超时（AI推理可能耗时较长）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;

        # 缓冲设置
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # WebSocket代理
    location /ws/ {
        proxy_pass http://aifde_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket长连接
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 健康检查
    location = /health {
        proxy_pass http://aifde_backend/api/v1/health;
        proxy_set_header Host $host;
    }

    # 文档（Swagger UI）
    location /docs {
        proxy_pass http://aifde_backend;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://aifde_backend;
        proxy_set_header Host $host;
    }

    # 默认返回API信息
    location / {
        return 200 '{"service": "AI-FDE Engine", "status": "running", "docs": "/docs", "health": "/health"}';
        add_header Content-Type application/json;
    }

    # 日志格式
    log_format aifde_json '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,"upstream_response_time":"$upstream_response_time","user_agent":"$http_user_agent"}';
    access_log /var/log/nginx/access.log aifde_json;
    error_log /var/log/nginx/error.log warn;
}
